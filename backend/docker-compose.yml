name: astudillo-auth

services:
  backend:
    image: astudillo-backend:local
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      BIND_HOST: 0.0.0.0
      TRUST_PROXY_IP: "true"
      PORT: "3000"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "const response = await fetch('http://127.0.0.1:3000/api/health'); if (!response.ok) process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: astudillo-nginx:local
    build:
      context: .
      target: nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "9617:443"
    volumes:
      - nginxfiles:/home/app/nginx:ro
    networks:
      - api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  api:

volumes:
  nginxfiles:
    external: true
