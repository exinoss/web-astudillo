server {
    listen 443 ssl;
    server_name localhost aplicaciones.uteq.edu.ec;

    ssl_certificate /home/app/nginx/ssl/__uteq_edu_ec2026Enero_cert_out.pem;
    ssl_certificate_key /home/app/nginx/ssl/__uteq_edu_ec.key;
    server_tokens off;
    client_max_body_size 1m;
    access_log off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream backend:3000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        return 404;
    }
}
