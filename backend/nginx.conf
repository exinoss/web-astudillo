server {
    listen 443 ssl;
    server_name localhost aplicaciones.uteq.edu.ec;

    ssl_certificate /home/app/nginx/ssl/__uteq_edu_ec2026Enero_cert_out.pem;
    ssl_certificate_key /home/app/nginx/ssl/__uteq_edu_ec.key;
    server_tokens off;
    client_max_body_size 1m;
    access_log off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Comunes a todo lo que va al backend.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;

    location /api/ {
        set $api_upstream backend:3000;
        proxy_pass http://$api_upstream;
        add_header Cache-Control "private, no-store" always;
    }

    # Subida de fotos del panel: el backend limita a 8 MB; aquí se deja margen para el formulario.
    location = /api/admin/medios {
        client_max_body_size 10m;
        set $api_upstream backend:3000;
        proxy_pass http://$api_upstream;
        add_header Cache-Control "private, no-store" always;
    }

    # Fotos subidas (volumen compartido con el backend). Sus nombres nunca se reutilizan.
    location /medios/ {
        alias /srv/medios/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Sitio estático: `actual` es el enlace que el publicador cambia al terminar cada versión.
    root /srv/sitio/actual;

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
        error_page 404 /404.html;
        add_header Cache-Control "no-cache";
    }
}
