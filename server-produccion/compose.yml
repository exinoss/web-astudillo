# Producción en el VPS: PostgreSQL, backend, publicador y nginx. Cloudflare va delante como proxy.
# Variables en server-produccion/.env (copia de .env.example). VERSION (SHA del commit) la fija desplegar.sh.
name: astudillo

x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-db-ready: &db-ready
  db:
    condition: service_healthy

services:
  # La base vive en un volumen. Usuarios: postgres/roles.sh.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # Solo en la interfaz local del VPS, para DBeaver por túnel SSH; desde fuera no es alcanzable.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}
      DB_MIGRA_PASSWORD: ${DB_MIGRA_PASSWORD:?Falta DB_MIGRA_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Falta DB_APP_PASSWORD}
      DB_PUB_PASSWORD: ${DB_PUB_PASSWORD:?Falta DB_PUB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/roles.sh:/docker-entrypoint-initdb.d/roles.sh:ro
    healthcheck:
      # Por TCP: durante la inicialización el servidor temporal solo escucha en el socket local.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "astudillo"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logs

  # docker compose run --rm migrar: lo lanza desplegar.sh antes de arrancar la versión nueva.
  migrar:
    image: ghcr.io/exinoss/astudillo-backend:${VERSION:?Falta VERSION}
    profiles: ["herramientas"]
    command: ["bun", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://astudillo_migra:${DB_MIGRA_PASSWORD}@db:5432/astudillo
    depends_on: *db-ready
    logging: *logs

  backend:
    image: ghcr.io/exinoss/astudillo-backend:${VERSION:?Falta VERSION}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://astudillo_app:${DB_APP_PASSWORD}@db:5432/astudillo
      APP_ORIGIN: https://${DOMINIO:?Falta DOMINIO}
      BIND_HOST: 0.0.0.0
      PORT: "3000"
      # nginx sobrescribe X-Real-IP con la IP real del visitante (la que envía Cloudflare).
      TRUST_PROXY_IP: "true"
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Falta GOOGLE_CLIENT_ID}
      SMTP_HOST: ${SMTP_HOST:?Falta SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:?Falta SMTP_PORT}
      SMTP_USER: ${SMTP_USER:?Falta SMTP_USER}
      SMTP_PASS: ${SMTP_PASS:?Falta SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:?Falta SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:?Falta SMTP_FROM_NAME}
    volumes:
      - medios:/app/medios
      - privados:/app/medios-privados
    depends_on: *db-ready
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/api/health'); if (!r.ok) process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logs

  # Compila el sitio con cada publicación del panel y, con cada versión nueva, lo último publicado.
  publicador:
    image: ghcr.io/exinoss/astudillo-publicador:${VERSION:?Falta VERSION}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://astudillo_pub:${DB_PUB_PASSWORD}@db:5432/astudillo
      API_PROXY_TARGET: http://backend:3000
      # El cliente de Google del sitio es el mismo que valida el backend.
      PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      APP_VERSION: ${VERSION}
    volumes:
      - sitio:/srv/sitio
    depends_on:
      backend:
        condition: service_healthy
    logging: *logs

  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # La carpeta entera: un archivo montado suelto seguiría mostrando la versión anterior tras el git checkout.
      # nginx carga los *.conf; cabeceras.inc solo se incluye desde cada location.
      - ./nginx:/etc/nginx/conf.d:ro
      # Certificado de origen de Cloudflare (origen.pem y origen.key); no se sube a Git.
      - ./certificados:/etc/nginx/certificados:ro
      - sitio:/srv/sitio:ro
      - medios:/srv/medios:ro
    depends_on:
      backend:
        condition: service_healthy
    logging: *logs

volumes:
  pgdata:
  medios:
  privados:
  sitio:
