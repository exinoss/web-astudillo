# Primera barrera ante fuerza bruta: el backend aplica además su límite progresivo por correo e IP.
limit_req_zone $binary_remote_addr zone=acceso:10m rate=30r/m;
limit_req_status 429;

# Otra cuenta de Cloudflare podría apuntar su dominio a esta IP: solo se atiende el nuestro.
# Al cambiar de dominio hay que cambiarlo también en los server_name de abajo (además de DOMINIO en .env).
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
}

# Cloudflare entra por HTTPS (modo Full strict); lo que llegue por HTTP se redirige.
server {
    listen 80;
    server_name lanuevahistoria.tech www.lanuevahistoria.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name lanuevahistoria.tech www.lanuevahistoria.tech;

    ssl_certificate /etc/nginx/certificados/origen.pem;
    ssl_certificate_key /etc/nginx/certificados/origen.key;
    server_tokens off;
    client_max_body_size 1m;
    access_log off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Comunes a todo lo que va al backend. $remote_addr ya es la IP real (cloudflare.conf).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
    set $api_upstream backend:3000;

    location /api/ {
        proxy_pass http://$api_upstream;
        add_header Cache-Control "private, no-store" always;
        include /etc/nginx/conf.d/cabeceras.inc;
    }

    # Fuera del límite de acceso: cada visita la pide, muchos usuarios móviles comparten IP y su token
    # aleatorio no se puede adivinar.
    location = /api/auth/refresh {
        proxy_pass http://$api_upstream;
        add_header Cache-Control "private, no-store" always;
        include /etc/nginx/conf.d/cabeceras.inc;
    }

    location /api/auth/ {
        limit_req zone=acceso burst=20 nodelay;
        proxy_pass http://$api_upstream;
        add_header Cache-Control "private, no-store" always;
        include /etc/nginx/conf.d/cabeceras.inc;
    }

    # Fotos del panel: el backend limita a 8 MB; aquí se deja margen para el formulario.
    location = /api/admin/medios {
        client_max_body_size 10m;
        proxy_pass http://$api_upstream;
        add_header Cache-Control "private, no-store" always;
        include /etc/nginx/conf.d/cabeceras.inc;
    }

    # Alertas ciudadanas con foto: el backend limita la foto a 5 MB.
    location = /api/participacion/alertas {
        client_max_body_size 6m;
        proxy_pass http://$api_upstream;
        add_header Cache-Control "private, no-store" always;
        include /etc/nginx/conf.d/cabeceras.inc;
    }

    # Fotos del panel (volumen compartido con el backend). Sus nombres nunca se reutilizan.
    # Las fotos de las alertas están en otro volumen que nginx no monta: solo las sirve la API.
    location /medios/ {
        alias /srv/medios/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/cabeceras.inc;
    }

    # Sitio estático: el publicador cambia `dist` por la compilación nueva al terminar cada publicación.
    root /srv/sitio/dist;

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/cabeceras.inc;
    }

    location / {
        try_files $uri $uri/ =404;
        # Una carpeta sin index.html (p. ej. /propuestas/) da 403 en nginx: para el visitante es un 404.
        error_page 403 404 =404 /404.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/cabeceras.inc;
    }
}
